<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>chat.io - 轻量聊天</title>
<style>
  :root {
    --hue: 30;
    --bg: oklch(0.18 0.012 var(--hue));
    --surface: oklch(0.22 0.012 var(--hue));
    --surface2: oklch(0.26 0.012 var(--hue));
    --border: oklch(0.32 0.012 var(--hue));
    --text: oklch(0.92 0.004 var(--hue));
    --text-dim: oklch(0.65 0.008 var(--hue));
    --accent: oklch(0.68 0.18 160);
    --accent-glow: oklch(0.68 0.18 160 / 0.15);
    --danger: oklch(0.58 0.22 20);
    --radius: 14px;
    --radius-sm: 8px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; height: 100dvh;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ── Auth Screen ── */
  .auth-container {
    display: flex; align-items: center; justify-content: center;
    height: 100%; padding: 20px;
  }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(24px, 5vw, 40px);
    width: 100%; max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .auth-card .logo {
    font-size: clamp(1.6rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    color: var(--text);
  }

  .auth-card .logo span { color: var(--accent); }

  .auth-card .subtitle {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 28px;
  }

  .auth-card label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    margin-top: 16px;
  }

  .auth-card label:first-of-type { margin-top: 0; }

  .auth-card input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.95rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .auth-card input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .auth-card .btn {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: oklch(0.12 0.01 var(--hue));
    font-size: 0.95rem;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .auth-card .btn:active { transform: scale(0.97); opacity: 0.85; }

  .auth-card .switch {
    text-align: center;
    margin-top: 16px;
    font-size: 0.82rem;
    color: var(--text-dim);
  }

  .auth-card .switch a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
  }

  .auth-error {
    font-size: 0.8rem;
    color: var(--danger);
    margin-top: 8px;
    min-height: 18px;
  }

  /* ── Chat Layout ── */
  .chat-app {
    display: none;
    height: 100%; height: 100dvh;
  }

  .chat-app.active { display: flex; flex-direction: column; }
  .auth-container.hidden { display: none; }

  /* Header */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 52px;
  }

  .chat-header .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-header .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: oklch(0.12 0.01 var(--hue));
    font-weight: 700;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .chat-header .username {
    font-weight: 600;
    font-size: 0.9rem;
  }

  .chat-header .header-actions {
    display: flex; gap: 6px;
  }

  .icon-btn {
    background: none; border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1rem;
    transition: background 0.15s, color 0.15s;
  }

  .icon-btn:hover { background: var(--surface2); color: var(--text); }

  .icon-btn.danger { border-color: var(--danger); color: var(--danger); }
  .icon-btn.danger:hover { background: oklch(0.58 0.22 20 / 0.12); }

  /* Contacts Bar */
  .contacts-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .contacts-bar::-webkit-scrollbar { display: none; }

  .contact-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 7px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.82rem;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }

  .contact-chip:hover { border-color: var(--accent); }

  .contact-chip.active {
    border-color: var(--accent);
    background: var(--accent-glow);
    color: var(--accent);
    font-weight: 700;
  }

  .contact-chip .chip-avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700;
    color: oklch(0.12 0.01 var(--hue));
    flex-shrink: 0;
  }

  .contact-chip .new-chat {
    font-size: 1.1rem; color: var(--accent); font-weight: 700; margin-right: 4px;
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 80%;
    animation: msgIn 0.2s ease-out;
    margin-bottom: 2px;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.self { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; align-items: flex-start; }

  .msg-sender {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 2px;
    padding: 0 4px;
  }

  .msg-row.self .msg-sender { display: none; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 0.9rem;
    line-height: 1.45;
    word-break: break-word;
    position: relative;
  }

  .msg-row.self .msg-bubble {
    background: var(--accent);
    color: oklch(0.12 0.01 var(--hue));
    border-bottom-right-radius: 6px;
  }

  .msg-row.other .msg-bubble {
    background: var(--surface2);
    color: var(--text);
    border-bottom-left-radius: 6px;
  }

  .msg-time {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 2px;
    padding: 0 6px;
  }

  .date-divider {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 12px 0;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .empty-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    gap: 10px;
  }

  .empty-chat .icon {
    font-size: 3rem;
    opacity: 0.3;
  }

  .empty-chat p { font-size: 0.85rem; }

  /* Input */
  .chat-input-area {
    display: flex;
    gap: 8px;
    padding: 10px 16px 14px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chat-input-area input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--surface2);
    color: var(--text);
    font-size: 0.9rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }

  .chat-input-area input:focus { border-color: var(--accent); }

  .chat-input-area .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: oklch(0.12 0.01 var(--hue));
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }

  .chat-input-area .send-btn:active { transform: scale(0.92); opacity: 0.8; }

  /* New Chat Dialog */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 10;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  .overlay.active { display: flex; }

  .dialog {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(20px, 4vw, 28px);
    width: 100%; max-width: 340px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }

  .dialog h3 {
    font-size: 1rem;
    margin-bottom: 16px;
  }

  .dialog label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }

  .dialog input, .dialog select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.9rem;
    font-family: var(--font);
    outline: none;
    margin-bottom: 14px;
  }

  .dialog input:focus, .dialog select:focus {
    border-color: var(--accent);
  }

  .dialog .btn-row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .dialog .btn-row button {
    padding: 8px 18px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 0.85rem;
    font-family: var(--font);
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.15s;
  }

  .dialog .btn-row .primary {
    background: var(--accent);
    color: oklch(0.12 0.01 var(--hue));
    border-color: var(--accent);
  }

  .dialog .btn-row .secondary {
    background: transparent;
    color: var(--text-dim);
  }

  .dialog .dialog-error {
    font-size: 0.75rem;
    color: var(--danger);
    margin-bottom: 8px;
    min-height: 16px;
  }

  @media (min-width: 768px) {
    .chat-app {
      max-width: 800px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .messages { padding: 20px 24px; }
    .chat-input-area { padding: 12px 24px 16px; }
    .chat-header { padding: 10px 24px; }
    .contacts-bar { padding: 8px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg-row { animation: none; }
  }
</style>
</head>
<body>

<!-- ── Auth ── -->
<div class="auth-container" id="authScreen">
  <div class="auth-card">
    <div class="logo">chat<span>.io</span></div>
    <div class="subtitle" id="authSubtitle">轻量聊天，即刻开始</div>

    <label for="authUser">用户名</label>
    <input type="text" id="authUser" placeholder="输入用户名" autocomplete="username" maxlength="20">

    <label for="authPass">密码</label>
    <input type="password" id="authPass" placeholder="输入密码" autocomplete="current-password" maxlength="32">

    <label for="authPassConfirm" id="confirmGroup" style="display:none">确认密码</label>
    <input type="password" id="authPassConfirm" placeholder="再次输入密码" style="display:none" maxlength="32">

    <div class="auth-error" id="authError"></div>

    <button class="btn" id="authBtn">登录</button>

    <div class="switch">
      <span id="switchText">没有账号？</span>
      <a id="switchLink">立即注册</a>
    </div>
  </div>
</div>

<!-- ── Chat ── -->
<div class="chat-app" id="chatApp">
  <div class="chat-header">
    <div class="user-info">
      <div class="avatar" id="myAvatar"></div>
      <span class="username" id="myUsername"></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="addContactBtn" title="添加联系人">+</button>
      <button class="icon-btn danger" id="logoutBtn" title="退出登录">&#x2192;</button>
    </div>
  </div>

  <div class="contacts-bar" id="contactsBar">
    <div class="contact-chip active" data-contact="__all__">
      <span class="chip-avatar" style="background:var(--accent)">#</span>
      <span>公共频道</span>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-chat">
      <div class="icon">&#x1f4ac;</div>
      <p>选择联系人或发送消息</p>
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="msgInput" placeholder="输入消息..." maxlength="500" autocomplete="off">
    <button class="send-btn" id="sendBtn">&#x2191;</button>
  </div>
</div>

<!-- ── New Chat Dialog ── -->
<div class="overlay" id="newChatOverlay">
  <div class="dialog">
    <h3>新建聊天</h3>
    <label>选择用户</label>
    <select id="userSelect"></select>
    <div class="dialog-error" id="dialogError"></div>
    <div class="btn-row">
      <button class="secondary" id="cancelNewChat">取消</button>
      <button class="primary" id="confirmNewChat">开始聊天</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const STORAGE_USERS = 'chatio_users';
  const STORAGE_MSGS = 'chatio_msgs';
  const STORAGE_CONTACTS = 'chatio_contacts';
  const STORAGE_SESSION = 'chatio_session';

  /* ── Helpers ── */
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key)) || null; } catch(e) { return null; }
  }

  function saveJSON(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function timeStr(ts) {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function dateLabel(ts) {
    const d = new Date(ts);
    const now = new Date();
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const day = d.getDate();
    if (y === now.getFullYear() && m === now.getMonth()+1 && day === now.getDate()) return '今天';
    return y + '年' + m + '月' + day + '日';
  }

  /* ── State ── */
  let currentUser = null;
  let currentChat = '__all__';
  let allMessages = loadJSON(STORAGE_MSGS) || {};
  let allContacts = loadJSON(STORAGE_CONTACTS) || {};

  /* ── Auth ── */
  let isRegisterMode = false;

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    $('#authSubtitle').textContent = isRegisterMode ? '创建新账号' : '轻量聊天，即刻开始';
    $('#authBtn').textContent = isRegisterMode ? '注册' : '登录';
    $('#switchText').textContent = isRegisterMode ? '已有账号？' : '没有账号？';
    $('#switchLink').textContent = isRegisterMode ? '去登录' : '立即注册';
    $('#confirmGroup').style.display = isRegisterMode ? '' : 'none';
    $('#authPassConfirm').style.display = isRegisterMode ? '' : 'none';
    $('#authError').textContent = '';
    $('#authUser').value = '';
    $('#authPass').value = '';
    $('#authPassConfirm').value = '';
  }

  $('#switchLink').addEventListener('click', toggleAuthMode);

  $('#authBtn').addEventListener('click', () => {
    const user = $('#authUser').value.trim();
    const pass = $('#authPass').value;
    const confirm = $('#authPassConfirm').value;

    if (!user || !pass) {
      $('#authError').textContent = '请填写用户名和密码';
      return;
    }
    if (user.length < 2) {
      $('#authError').textContent = '用户名至少2个字符';
      return;
    }
    if (pass.length < 4) {
      $('#authError').textContent = '密码至少4个字符';
      return;
    }

    let users = loadJSON(STORAGE_USERS) || {};

    if (isRegisterMode) {
      if (pass !== confirm) {
        $('#authError').textContent = '两次密码不一致';
        return;
      }
      if (users[user]) {
        $('#authError').textContent = '用户名已存在';
        return;
      }
      users[user] = { password: pass, createdAt: Date.now() };
      saveJSON(STORAGE_USERS, users);

      if (!allContacts[user]) allContacts[user] = [];
      saveJSON(STORAGE_CONTACTS, allContacts);

      currentUser = user;
      saveJSON(STORAGE_SESSION, { user });
      enterChat();
    } else {
      if (!users[user]) {
        $('#authError').textContent = '用户不存在';
        return;
      }
      if (users[user].password !== pass) {
        $('#authError').textContent = '密码错误';
        return;
      }
      currentUser = user;
      saveJSON(STORAGE_SESSION, { user });
      enterChat();
    }
  });

  // Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement) {
      const ae = document.activeElement;
      if (ae.closest('#authScreen')) $('#authBtn').click();
      if (ae === $('#msgInput') && $('#msgInput').value.trim()) sendMessage();
    }
  });

  /* ── Session restore ── */
  function tryRestore() {
    const session = loadJSON(STORAGE_SESSION);
    if (session && session.user) {
      const users = loadJSON(STORAGE_USERS) || {};
      if (users[session.user]) {
        currentUser = session.user;
        return true;
      }
    }
    return false;
  }

  /* ── Chat ── */
  function enterChat() {
    $('#authScreen').classList.add('hidden');
    $('#chatApp').classList.add('active');
    $('#myUsername').textContent = currentUser;
    $('#myAvatar').textContent = currentUser[0].toUpperCase();

    if (!allContacts[currentUser]) allContacts[currentUser] = [];
    saveJSON(STORAGE_CONTACTS, allContacts);

    currentChat = '__all__';
    renderContacts();
    renderMessages();
  }

  function renderContacts() {
    const bar = $('#contactsBar');
    bar.innerHTML = '';

    const allChip = document.createElement('div');
    allChip.className = 'contact-chip' + (currentChat === '__all__' ? ' active' : '');
    allChip.dataset.contact = '__all__';
    allChip.innerHTML = '<span class="chip-avatar" style="background:var(--accent)">#</span><span>公共频道</span>';
    allChip.addEventListener('click', () => switchChat('__all__'));
    bar.appendChild(allChip);

    const contacts = allContacts[currentUser] || [];
    contacts.forEach(c => {
      const chip = document.createElement('div');
      chip.className = 'contact-chip' + (currentChat === c ? ' active' : '');
      chip.dataset.contact = c;
      const hue = hashHue(c);
      chip.innerHTML = '<span class="chip-avatar" style="background:oklch(0.62 0.16 ' + hue + ')">' + c[0].toUpperCase() + '</span><span>' + c + '</span>';
      chip.addEventListener('click', () => switchChat(c));
      bar.appendChild(chip);
    });
  }

  function hashHue(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return Math.abs(h % 360);
  }

  function switchChat(target) {
    currentChat = target;
    $$('.contact-chip').forEach(c => c.classList.toggle('active', c.dataset.contact === target));
    renderMessages();
    scrollBottom();
  }

  function getChatKey() {
    if (currentChat === '__all__') return '__all__';
    const sorted = [currentUser, currentChat].sort();
    return sorted.join('::');
  }

  function renderMessages() {
    const container = $('#messages');
    const key = getChatKey();
    const msgs = allMessages[key] || [];

    if (msgs.length === 0) {
      container.innerHTML = '<div class="empty-chat"><div class="icon">&#x1f4ac;</div><p>还没有消息，开始聊天吧</p></div>';
      return;
    }

    const fragments = [];
    let lastDate = '';

    msgs.forEach(m => {
      const dLabel = dateLabel(m.ts);
      if (dLabel !== lastDate) {
        fragments.push('<div class="date-divider">' + dLabel + '</div>');
        lastDate = dLabel;
      }

      const cls = m.from === currentUser ? 'self' : 'other';
      fragments.push(
        '<div class="msg-row ' + cls + '">' +
        (cls === 'other' ? '<span class="msg-sender">' + escapeHtml(m.from) + '</span>' : '') +
        '<div class="msg-bubble">' + escapeHtml(m.text) + '</div>' +
        '<span class="msg-time">' + timeStr(m.ts) + '</span>' +
        '</div>'
      );
    });

    container.innerHTML = fragments.join('');
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function sendMessage() {
    const input = $('#msgInput');
    const text = input.value.trim();
    if (!text) return;

    const key = getChatKey();
    if (!allMessages[key]) allMessages[key] = [];
    const msg = { id: genId(), from: currentUser, text, ts: Date.now() };
    allMessages[key].push(msg);
    saveJSON(STORAGE_MSGS, allMessages);

    input.value = '';
    renderMessages();
    scrollBottom();

    // Auto-add contact for DM
    if (currentChat !== '__all__' && !allContacts[currentUser].includes(currentChat)) {
      allContacts[currentUser].push(currentChat);
      saveJSON(STORAGE_CONTACTS, allContacts);
      renderContacts();
    }
  }

  function scrollBottom() {
    requestAnimationFrame(() => {
      $('#messages').scrollTop = $('#messages').scrollHeight;
    });
  }

  $('#sendBtn').addEventListener('click', sendMessage);

  /* ── New Chat Dialog ── */
  $('#addContactBtn').addEventListener('click', () => {
    const users = loadJSON(STORAGE_USERS) || {};
    const select = $('#userSelect');
    select.innerHTML = '';
    let hasOthers = false;
    Object.keys(users).forEach(u => {
      if (u !== currentUser) {
        hasOthers = true;
        const opt = document.createElement('option');
        opt.value = u;
        opt.textContent = u;
        select.appendChild(opt);
      }
    });
    if (!hasOthers) {
      select.innerHTML = '<option disabled>暂无其他用户</option>';
    }
    $('#dialogError').textContent = '';
    $('#newChatOverlay').classList.add('active');
  });

  $('#cancelNewChat').addEventListener('click', () => {
    $('#newChatOverlay').classList.remove('active');
  });

  $('#confirmNewChat').addEventListener('click', () => {
    const target = $('#userSelect').value;
    if (!target || target === currentUser) {
      $('#dialogError').textContent = '请选择一个用户';
      return;
    }
    if (!allContacts[currentUser].includes(target)) {
      allContacts[currentUser].push(target);
      saveJSON(STORAGE_CONTACTS, allContacts);
    }
    $('#newChatOverlay').classList.remove('active');
    currentChat = target;
    renderContacts();
    renderMessages();
    scrollBottom();
  });

  // Close overlay on backdrop click
  $('#newChatOverlay').addEventListener('click', e => {
    if (e.target === $('#newChatOverlay')) $('#newChatOverlay').classList.remove('active');
  });

  /* ── Logout ── */
  $('#logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_SESSION);
    currentUser = null;
    currentChat = '__all__';
    $('#chatApp').classList.remove('active');
    $('#authScreen').classList.remove('hidden');
    isRegisterMode = false;
    toggleAuthMode();
    toggleAuthMode(); // reset to login
  });

  /* ── Polling for new messages (same-device multi-tab simulation) ── */
  let lastMsgCount = 0;
  setInterval(() => {
    if (!currentUser) return;
    const fresh = loadJSON(STORAGE_MSGS) || {};
    const freshContacts = loadJSON(STORAGE_CONTACTS) || {};
    let total = 0;
    Object.values(fresh).forEach(arr => { total += (arr || []).length; });
    if (total !== lastMsgCount) {
      lastMsgCount = total;
      allMessages = fresh;
      allContacts = freshContacts;
      renderMessages();
      renderContacts();
      scrollBottom();
    }
  }, 1500);

  /* ── Init ── */
  if (tryRestore()) {
    enterChat();
    lastMsgCount = Object.values(allMessages).reduce((s, a) => s + (a || []).length, 0);
  }
})();
</script>
</body>
</html>
