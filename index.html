<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线上聊天室</title>
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: transparent;
    /* Liquid glass: ultra-transparent panels on image background */
    --panel: rgba(255,255,255,0.18);
    --panel2: rgba(255,255,255,0.12);
    --panel-solid: rgba(255,255,255,0.85);
    --border: rgba(255,255,255,0.45);
    --border-strong: rgba(255,255,255,0.65);
    --text: #f0f0f5;
    --muted: rgba(240,240,245,0.70);
    --accent: #7c8cff;
    --bubble-me: rgba(124,140,255,0.65);
    --bubble-other: rgba(255,255,255,0.25);
    --danger: #ff6b6b;
    --glass-blur: 4px;
    --glass-saturate: 180%;
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.18);
    --glass-highlight: inset 0 1px 1px rgba(255,255,255,0.5), inset 0 -1px 1px rgba(0,0,0,0.05);
    --glass-edge: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.5) 100%);
  }
  html, body { height: 100%; }
  body {
    background: url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* Bottom blur gradient layer - "脚底模糊" effect */
  body::before {
    content: '';
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 45%;
    z-index: -1;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0) 100%);
    background: rgba(255,255,255,0.12);
    pointer-events: none;
  }
  /* Top subtle blur for balance */
  body::after {
    content: '';
    position: fixed;
    left: 0; right: 0; top: 0;
    height: 25%;
    z-index: -1;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
    background: rgba(255,255,255,0.06);
    pointer-events: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }

  /* Reusable liquid glass surface */
  .glass {
    background: var(--panel);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    border: 1px solid var(--border);
    box-shadow: var(--glass-shadow), var(--glass-highlight);
    position: relative;
  }
  /* Specular sheen on top edge (refraction look) */
  .glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: var(--glass-edge);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: 0.7;
  }

  /* ===== App layout ===== */
  #app { display: flex; height: 100vh; width: 100vw; }

  /* ===== Sidebar ===== */
  #sidebar {
    width: 320px;
    min-width: 320px;
    background: var(--panel);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    border-right: 1px solid var(--border);
    box-shadow: var(--glass-shadow), var(--glass-highlight);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* Liquid glass edge sheen on sidebar */
  #sidebar::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.1) 30%, rgba(255,255,255,0.1) 70%, rgba(255,255,255,0.8));
    pointer-events: none;
  }
  .sidebar-header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
    gap: 12px;
  }
  .title { font-size: 17px; font-weight: 600; flex: 1; }
  .user-chip {
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(2px) saturate(160%);
    -webkit-backdrop-filter: blur(2px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 3px 4px 3px 12px;
    font-size: 12px;
    color: var(--muted);
    max-width: 130px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .user-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s cubic-bezier(.4,0,.2,1);
    background: rgba(255,255,255,0.20);
    backdrop-filter: blur(2px) saturate(150%);
    -webkit-backdrop-filter: blur(2px) saturate(150%);
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 2px 8px rgba(31,38,135,0.08);
  }
  .icon-btn:hover {
    background: rgba(255,255,255,0.35);
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 6px 16px rgba(31,38,135,0.15);
  }
  .icon-btn:active { transform: translateY(0) scale(.96); }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--text); }

  /* Dropdown menu */
  #menu {
    position: absolute;
    top: 56px; left: 12px;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(4px) saturate(200%);
    -webkit-backdrop-filter: blur(4px) saturate(200%);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    width: 200px;
    box-shadow: 0 12px 40px rgba(31,38,135,0.18), inset 0 1px 0 rgba(255,255,255,0.7);
    overflow: hidden;
    display: none;
    z-index: 50;
  }
  #menu.show { display: block; animation: menuIn .18s cubic-bezier(.4,0,.2,1); }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
  .menu-item {
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    font-size: 14px;
    transition: background .15s;
  }
  .menu-item:hover { background: rgba(255,255,255,0.30); }
  .menu-item svg { width: 18px; height: 18px; stroke: var(--text); }

  #group-list { flex: 1; overflow-y: auto; }
  .group-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.25);
    transition: background .15s;
  }
  .group-item:hover { background: rgba(255,255,255,0.22); }
  .group-item.active {
    background: rgba(124,140,255,0.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .group-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(2px) saturate(160%);
    -webkit-backdrop-filter: blur(2px) saturate(160%);
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.7), 0 2px 8px rgba(31,38,135,0.1);
  }
  .group-meta { flex: 1; min-width: 0; }
  .group-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group-code { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .group-leave {
    opacity: 0; transition: opacity .15s;
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .group-item:hover .group-leave { opacity: 1; }
  .group-leave:hover { background: rgba(239,68,68,0.22); }
  .group-leave svg { width: 16px; height: 16px; stroke: var(--danger); }

  .empty-state {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted);
    text-align: center;
    padding: 20px;
    gap: 8px;
  }
  .empty-state svg {
    width: 56px; height: 56px;
    stroke: rgba(124,140,255,0.75);
    margin-bottom: 8px;
    filter: drop-shadow(0 4px 12px rgba(124,140,255,0.3));
  }
  .empty-state .hint { font-size: 13px; }

  /* ===== Chat area ===== */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    border-left: 1px solid var(--border);
    box-shadow: inset 1px 0 0 rgba(255,255,255,0.5);
    position: relative;
  }
  .chat-header {
    height: 60px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 20px; gap: 12px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(4px) saturate(180%);
    -webkit-backdrop-filter: blur(4px) saturate(180%);
    box-shadow: inset 0 -1px 0 rgba(255,255,255,0.4), 0 2px 12px rgba(31,38,135,0.06);
  }
  .chat-header .group-avatar { width: 38px; height: 38px; font-size: 19px; }
  .chat-header .info { flex: 1; }
  .chat-header .name { font-size: 15px; font-weight: 600; }
  .chat-header .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .conn-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px rgba(34,197,94,0.7), inset 0 1px 1px rgba(255,255,255,0.6);
  }
  .conn-dot.off { background: var(--danger); box-shadow: 0 0 8px rgba(239,68,68,0.7); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg-row { display: flex; flex-direction: column; gap: 3px; max-width: 70%; }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; }
  .msg-sender { font-size: 11px; color: var(--muted); padding: 0 6px; }
  .msg-row.me .msg {
    background: var(--bubble-me);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    border-bottom-right-radius: 4px;
    backdrop-filter: blur(3px) saturate(180%);
    -webkit-backdrop-filter: blur(3px) saturate(180%);
    box-shadow: 0 6px 20px rgba(99,102,241,0.35), inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -1px 0 rgba(0,0,0,0.1);
  }
  .msg-row.other .msg {
    background: var(--bubble-other);
    backdrop-filter: blur(3px) saturate(180%);
    -webkit-backdrop-filter: blur(3px) saturate(180%);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 4px 16px rgba(31,38,135,0.10), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .msg-time { font-size: 10px; color: var(--muted); padding: 0 6px; }
  .sys-msg {
    align-self: center;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(2px) saturate(160%);
    -webkit-backdrop-filter: blur(2px) saturate(160%);
    color: var(--muted);
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }

  .composer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(2px) saturate(180%);
    -webkit-backdrop-filter: blur(2px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
  }
  .composer input {
    flex: 1;
    background: rgba(255,255,255,0.18);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 11px 18px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    transition: all .2s;
    box-shadow: inset 0 1px 2px rgba(31,38,135,0.06);
  }
  .composer input::placeholder { color: rgba(240,240,245,0.45); }
  .composer input:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.28);
    box-shadow: 0 0 0 3px rgba(124,140,255,0.25), inset 0 1px 2px rgba(0,0,0,0.1);
  }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    transition: all .2s cubic-bezier(.4,0,.2,1);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 4px 14px rgba(124,140,255,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .send-btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,140,255,0.55); }
  .send-btn:active { transform: scale(.92); }
  .send-btn svg { width: 20px; height: 20px; stroke: #fff; }

  #welcome-screen {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); gap: 12px;
    padding: 20px;
  }
  #welcome-screen svg {
    width: 72px; height: 72px;
    stroke: rgba(124,140,255,0.85);
    filter: drop-shadow(0 4px 16px rgba(124,140,255,0.4));
  }
  #welcome-screen h2 { color: var(--text); font-weight: 500; font-size: 18px; }
  #welcome-screen p { font-size: 13px; }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.15);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: rgba(255,255,255,0.60);
    backdrop-filter: blur(30px) saturate(200%) brightness(1.15);
    -webkit-backdrop-filter: blur(30px) saturate(200%) brightness(1.15);
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: 24px;
    width: 100%; max-width: 420px;
    padding: 28px 24px 24px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.20), inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -1px 1px rgba(255,255,255,0.4);
    position: relative;
    animation: modalIn .25s cubic-bezier(.34,1.56,.64,1);
    color: #1a1a2e;
  }
  .modal h2 { color: #1a1a2e; }
  .modal .field label { color: rgba(26,26,46,0.7); }
  .modal .field input::placeholder { color: rgba(26,26,46,0.4); }
  @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
  /* Refractive edge gradient on modal */
  .modal::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.2px;
    background: var(--glass-edge);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }
  /* Top specular highlight */
  .modal::after {
    content: '';
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 40%;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), transparent);
    pointer-events: none;
    opacity: 0.6;
  }
  .modal > * { position: relative; z-index: 1; }
  .modal h2 { font-size: 18px; margin-bottom: 20px; text-align: center; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field input[type="text"],
  .field input[type="password"] {
    width: 100%;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(26,26,46,0.12);
    border-radius: 10px;
    padding: 11px 14px;
    color: #1a1a2e;
    font-size: 14px;
    outline: none;
    transition: all .2s;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
  }
  .field input[type="text"]:focus,
  .field input[type="password"]:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.75);
    box-shadow: 0 0 0 3px rgba(124,140,255,0.2), inset 0 1px 2px rgba(0,0,0,0.04);
  }
  .field input::placeholder { color: rgba(26,26,46,0.45); }

  .code-row { display: flex; gap: 8px; }
  .code-row input { flex: 1; }
  .code-toggle {
    display: flex;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(26,26,46,0.12);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .code-toggle button {
    flex: 1;
    padding: 8px;
    font-size: 12px;
    color: rgba(26,26,46,0.6);
    transition: all .2s;
  }
  .code-toggle button.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(124,140,255,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }

  .icon-picker {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }
  .icon-picker button {
    aspect-ratio: 1;
    border-radius: 10px;
    font-size: 20px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(26,26,46,0.12);
    transition: all .15s;
  }
  .icon-picker button:hover { background: rgba(255,255,255,0.85); transform: translateY(-1px); }
  .icon-picker button.active {
    border-color: var(--accent);
    background: rgba(124,140,255,0.5);
    transform: scale(1.08);
    box-shadow: 0 4px 12px rgba(124,140,255,0.3);
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    transition: all .2s cubic-bezier(.4,0,.2,1);
    position: relative;
    overflow: hidden;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 4px 14px rgba(124,140,255,0.4);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,140,255,0.5); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(26,26,46,0.15);
    color: #1a1a2e;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.8); }

  .field-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.35); border-radius: 4px; backdrop-filter: blur(4px); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.5); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(2px) saturate(180%);
    -webkit-backdrop-filter: blur(2px) saturate(180%);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    z-index: 200;
    box-shadow: 0 12px 36px rgba(31,38,135,0.18), inset 0 1px 0 rgba(255,255,255,0.65);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    #sidebar { position: absolute; z-index: 20; height: 100%; transform: translateX(0); transition: transform .2s; }
    #sidebar.hidden { transform: translateX(-100%); }
    #chat-area { width: 100%; }

<script>
/* ===================== State ===================== */
const STORAGE_KEY = 'chatroom.state.v1';
const ACCOUNTS_KEY = 'chatroom.accounts.v1';
const SESSION_KEY = 'chatroom.session.v1';
const INVITES_KEY = 'chatroom.invites.v1';
const GROUPS_REGISTRY_KEY = 'chatroom.groups.v1';
const DEFAULT_INVITES = ['CHAT2026', 'WELCOME123', 'CHATIO666', 'VIP8888', 'HELLO999'];
const ICONS = ['💬','🔥','🌟','🎮','🎵','📚','💻','⚽','🍕','🐱','🌈','🚀','☕','🎨','🏆','🌙','🎬','📷','🎲','🌮','🦊','🌸','⚡','☕'];
const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
const TOPIC_PREFIX = 'trae-chatroom-v1/';

let state = loadState();
let client = null;
let activeGroupId = null;
let selectedIcon = ICONS[0];
let codeMode = 'random';
let pendingCreateAction = null;
let authMode = 'register'; // 'register' | 'login'

/* ===================== Persistence ===================== */
function getUserStorageKey() {
  const user = getSession();
  return user ? `chatroom.state.v1.${user}` : STORAGE_KEY;
}
function loadState() {
  try {
    const raw = localStorage.getItem(getUserStorageKey());
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { nickname: '', groups: [] };
}
function saveState() {
  localStorage.setItem(getUserStorageKey(), JSON.stringify(state));
}
// Migrate shared legacy state to user-specific key on login
function migrateLegacyStateIfNeeded() {
  const userKey = getUserStorageKey();
  const legacyKey = STORAGE_KEY;
  if (userKey === legacyKey) return; // no user logged in yet
  // If user already has their own state, skip
  if (localStorage.getItem(userKey)) return;
  // No legacy data either, skip
  const legacyRaw = localStorage.getItem(legacyKey);
  if (!legacyRaw) return;
  // Copy legacy data to user's own key
  try {
    const legacyData = JSON.parse(legacyRaw);
    localStorage.setItem(userKey, JSON.stringify(legacyData));
  } catch(e) {}
}

/* ===================== Accounts / Auth ===================== */
const DEFAULT_ADMIN_USER = 'admin';
const DEFAULT_ADMIN_PASS = 'admin123';

function loadAccounts() {
  let accts = {};
  try {
    const raw = localStorage.getItem(ACCOUNTS_KEY);
    if (raw) accts = JSON.parse(raw);
  } catch(e) {}
  // Seed admin account if empty
  if (!accts[DEFAULT_ADMIN_USER]) {
    accts[DEFAULT_ADMIN_USER] = {
      nick: '管理员',
      pass: hashPass(DEFAULT_ADMIN_PASS),
      role: 'admin',
      createdAt: Date.now()
    };
    localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accts));
  }
  return accts;
}
function saveAccounts(accts) {
  localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accts));
}
function isAdmin(user) {
  if (!user) return false;
  const accts = localStorage.getItem(ACCOUNTS_KEY);
  if (!accts) return false;
  try {
    const a = JSON.parse(accts)[user];
    return a && a.role === 'admin';
  } catch(e) { return false; }
}
function loadInvites() {
  try {
    const raw = localStorage.getItem(INVITES_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  localStorage.setItem(INVITES_KEY, JSON.stringify(DEFAULT_INVITES));
  return [...DEFAULT_INVITES];
}
function saveInvites(list) {
  localStorage.setItem(INVITES_KEY, JSON.stringify(list));
}
function loadGroupRegistry() {
  try {
    const raw = localStorage.getItem(GROUPS_REGISTRY_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {};
}
function saveGroupRegistry(reg) {
  localStorage.setItem(GROUPS_REGISTRY_KEY, JSON.stringify(reg));
}
function registerGroup(g) {

    saveGroupRegistry(reg);

function getSession() {
  try {
    return localStorage.getItem(SESSION_KEY)
      || sessionStorage.getItem(SESSION_KEY) || '';
  } catch(e) { return ''; }
}
function setSession(user, remember) {
  // Always clear both first
  try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
  if (!user) return;
  if (remember) localStorage.setItem(SESSION_KEY, user);
  else sessionStorage.setItem(SESSION_KEY, user);
}
// Simple non-cryptographic hash (demo only; not for real security)
function hashPass(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) + h) ^ s.charCodeAt(i);
  }
  return (h >>> 0).toString(16);
}

function handleAuthSubmit() {
  const user = document.getElementById('auth-user').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const err = document.getElementById('auth-error');
  err.textContent = '';
  if (!user) { err.textContent = '请输入用户名'; return; }
  if (!pass) { err.textContent = '请输入密码'; return; }
  const accts = loadAccounts();

  if (authMode === 'register') {
    const nick = document.getElementById('auth-nick').value.trim();
    const invite = document.getElementById('auth-invite').value.trim();
    if (!nick) { err.textContent = '请输入昵称'; return; }
    if (!invite) { err.textContent = '请输入邀请码'; return; }
    if (!loadInvites().includes(invite)) { err.textContent = '邀请码无效'; return; }
    if (accts[user]) { err.textContent = '该用户名已被注册'; return; }
    accts[user] = { nick, pass: hashPass(pass), role: 'user', createdAt: Date.now() };
    saveAccounts(accts);
    setSession(user, document.getElementById('auth-remember').checked);
    // NEW USER: immediately create fresh empty per-user state (skip legacy migration)
    state = { nickname: nick, groups: [] };
    saveState();
    hideAuthModal();
    onAuthed();
    toast('注册成功，欢迎 ' + nick);
  } else {
    const acct = accts[user];
    if (!acct) { err.textContent = '用户不存在'; return; }
    if (acct.pass !== hashPass(pass)) { err.textContent = '密码错误'; return; }
    setSession(user, document.getElementById('auth-remember').checked);
    migrateLegacyStateIfNeeded();
    // Load per-user state from their own storage key
    state = loadState();
    state.nickname = acct.nick;
    saveState();
    hideAuthModal();
    onAuthed();
    toast('登录成功，欢迎回来 ' + acct.nick);
  }
}

function saveEditGroup() {
  if (!editingGroupCode) return;
  const name = document.getElementById('eg-name').value.trim();
  const newCode = document.getElementById('eg-code').value.trim().toUpperCase();
  const err = document.getElementById('eg-error');
  err.textContent = '';
  if (!name) { err.textContent = '请输入群聊名称'; return; }
  if (!newCode) { err.textContent = '请输入加入码'; return; }
  const oldCode = editingGroupCode;
  const reg = loadGroupRegistry();
  if (newCode !== oldCode && reg[newCode]) { err.textContent = '该加入码已被其他群使用'; return; }

  // Update registry
  const oldEntry = reg[oldCode] || {};
  if (newCode !== oldCode) delete reg[oldCode];
  reg[newCode] = {
    name, code: newCode, icon: editGroupIcon,
    createdAt: oldEntry.createdAt || Date.now()
  };
  saveGroupRegistry(reg);

  // Update local state groups
  state.groups.forEach(g => {
    if (g.code === oldCode) {
      g.name = name;
      g.icon = editGroupIcon;
      g.code = newCode;
    }
  });
  saveState();

  // MQTT: resubscribe if code changed
  if (newCode !== oldCode && client && client.connected) {
    try { client.unsubscribe(TOPIC_PREFIX + oldCode); } catch(e) {}
    client.subscribe(TOPIC_PREFIX + newCode, { qos: 0 });
  }

  // If currently viewing this group, refresh header
  if (activeGroupId) {
    const cur = state.groups.find(x => x.id === activeGroupId);
    if (cur && (cur.code === oldCode || cur.code === newCode)) {
      renderChatHeader(cur);
    }
  }

  document.getElementById('edit-group-modal').classList.remove('show');
  editingGroupCode = null;
  renderGroupList();
  renderAdminGroups();
  toast('群聊已更新');
}

/* ===================== MQTT ===================== */
function connectMQTT() {
  if (client) return;
  try {
    client = mqtt.connect(BROKER_URL, {
      clientId: 'chat_' + Math.random().toString(16).slice(2, 10),
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 10000
    });
    client.on('connect', () => {
      updateConnStatus(true);
      state.groups.forEach(g => {
        const topic = TOPIC_PREFIX + g.code;
        client.subscribe(topic, { qos: 0 });
        // 请求在线成员
        client.publish(topic + '/presence', JSON.stringify({ type:'who', nick: state.nickname }), { qos: 0 });
      });
    });
    client.on('reconnect', () => updateConnStatus(false));
    client.on('close', () => updateConnStatus(false));
    client.on('error', () => updateConnStatus(false));
    client.on('message', (topic, payload) => {
      handleMessage(topic, payload.toString());
    });
  } catch(e) {
    console.error('MQTT connect failed', e);
    updateConnStatus(false);
  }
}

function updateConnStatus(online) {
  document.querySelectorAll('.conn-dot').forEach(d => {
    d.classList.toggle('off', !online);
  });
}

function handleMessage(topic, raw) {
  const groupCode = topic.replace(TOPIC_PREFIX, '').split('/')[0];
  const group = state.groups.find(g => g.code === groupCode);
  if (!group) return;

  let msg;
  try { msg = JSON.parse(raw); } catch(e) { return; }

  if (msg.type === 'chat') {
    // skip own messages (already rendered optimistically)
    if (msg.id && group._sentIds && group._sentIds.has(msg.id)) {
      return;
    }
    if (!group.messages) group.messages = [];
    group.messages.push(msg);
    saveState();
    if (activeGroupId === group.id) renderMessages();
  } else if (msg.type === 'join') {
    if (!group.messages) group.messages = [];
    group.messages.push({ type:'sys', text: msg.nick + ' 加入了群聊', ts: msg.ts });
    saveState();
    if (activeGroupId === group.id) renderMessages();
    // respond with presence so newcomer sees us
    client.publish(TOPIC_PREFIX + groupCode + '/presence',
      JSON.stringify({ type:'here', nick: state.nickname }), { qos: 0 });
  } else if (msg.type === 'presence') {
    // presence pings - just track count loosely
  }
}

function joinGroupTopic(code) {
  if (!client || !client.connected) return;
  client.subscribe(TOPIC_PREFIX + code, { qos: 0 });
  client.publish(TOPIC_PREFIX + code, JSON.stringify({
    type: 'join', nick: state.nickname, ts: Date.now()
  }), { qos: 0 });
}

    btn.addEventListener('click', e => {
      e.stopPropagation();
      leaveGroup(btn.dataset.leave);
    });
  });
}

/* ===================== UI: Chat ===================== */
function openChat(id) {
  const g = state.groups.find(x => x.id === id);
  if (!g) return;
  activeGroupId = id;
  renderGroupList();
  renderChatHeader(g);
  renderMessages();
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.style.display = 'none';
  // ensure sidebar toggle on mobile
  if (window.innerWidth <= 640) {
    document.getElementById('sidebar').classList.add('hidden');
  }
}

function renderChatHeader(g) {
  let area = document.getElementById('chat-area');
  // rebuild header + messages + composer if welcome screen present
  if (document.getElementById('welcome-screen')) {
    area.innerHTML = `
      <div class="chat-header">
        <div class="group-avatar">${g.icon}</div>
        <div class="info">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="sub">加入码：<span id="code-display">${escapeHtml(g.code)}</span></div>
        </div>
        <div class="conn-dot ${client&&client.connected?'':'off'}"></div>
      </div>
      <div id="messages"></div>
      <div class="composer">
        <input type="text" id="msg-input" placeholder="输入消息..." autocomplete="off">
        <button class="send-btn" id="send-btn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>`;
    bindComposer();
  } else {
    const hdr = area.querySelector('.chat-header');
    hdr.querySelector('.group-avatar').textContent = g.icon;
    hdr.querySelector('.name').textContent = g.name;
    document.getElementById('code-display').textContent = g.code;
  }
}

function renderMessages() {
  const g = state.groups.find(x => x.id === activeGroupId);
  if (!g) return;
  const box = document.getElementById('messages');
  if (!box) return;
  const msgs = g.messages || [];
  box.innerHTML = msgs.map(m => {
    if (m.type === 'sys') {
      return `<div class="sys-msg">${escapeHtml(m.text)}</div>`;
    }
    const mine = m.nick === state.nickname;
    const t = new Date(m.ts || Date.now());
    const time = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');
    return `<div class="msg-row ${mine?'me':'other'}">
      ${mine?'':`<div class="msg-sender">${escapeHtml(m.nick)}</div>`}
      <div class="msg">${escapeHtml(m.text)}</div>
      <div class="msg-time">${time}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function bindComposer() {
  const input = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim().length === 0;
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !sendBtn.disabled) send();
  });
  sendBtn.addEventListener('click', send);
  input.focus();
}

function send() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !activeGroupId) return;
  const g = state.groups.find(x => x.id === activeGroupId);
  if (!g) return;
  const msg = {
    type: 'chat',
    id: Math.random().toString(36).slice(2),
    nick: state.nickname,
    text: text,
    ts: Date.now()
  };
  if (!g._sentIds) g._sentIds = new Set();
  g._sentIds.add(msg.id);
  if (!g.messages) g.messages = [];
  g.messages.push(msg);
  saveState();
  renderMessages();
  input.value = '';
  document.getElementById('send-btn').disabled = true;
  if (client && client.connected) {
    client.publish(TOPIC_PREFIX + g.code, JSON.stringify(msg), { qos: 0 });
  } else {
    toast('未连接到服务器，消息未能发送');
  }
}

/* ===================== Groups actions ===================== */
function createGroup(name, code, icon) {
  const group = {
    id: 'g_' + Math.random().toString(36).slice(2, 10),
    name, code, icon,
    created: Date.now(),
    messages: []
  };
  state.groups.push(group);
  saveState();
  registerGroup(group);
  joinGroupTopic(code);
  renderGroupList();
  openChat(group.id);
  toast('群聊已创建');
}

function joinGroup(code) {
  const existing = state.groups.find(g => g.code === code);
  if (existing) {
    openChat(existing.id);
    toast('已在该群聊中');
    return;
  }
  // Look up registry for known group info
  const reg = loadGroupRegistry();
  const known = reg[code];
  const group = {
    id: 'g_' + Math.random().toString(36).slice(2, 10),
    name: known ? known.name : '群聊 ' + code,
    code,
    icon: known ? known.icon : '💬',
    created: known ? known.createdAt : Date.now(),
    messages: []
  };
  state.groups.push(group);
  saveState();
  registerGroup(group);
  joinGroupTopic(code);
  renderGroupList();
  openChat(group.id);
  toast('已加入群聊');
}

function leaveGroup(id) {
  if (!confirm('确定退出该群聊？')) return;
  const g = state.groups.find(x => x.id === id);
  if (g && client && client.connected) {
    client.unsubscribe(TOPIC_PREFIX + g.code);
  }
  state.groups = state.groups.filter(x => x.id !== id);
  if (activeGroupId === id) {
    activeGroupId = null;
    document.getElementById('chat-area').innerHTML = `
      <div id="welcome-screen">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <h2>选择一个群聊开始聊天</h2>
        <p>点击左上角 + 创建或加入群聊</p>
      </div>`;
  }
  saveState();
  renderGroupList();
  toast('已退出群聊');
}

/* ===================== Modals ===================== */
function showCreateModal() {
  document.getElementById('create-name').value = '';
  setCodeMode('random');
  renderIconPicker();
  selectedIcon = ICONS[0];
  document.getElementById('create-modal').classList.add('show');
  setTimeout(() => document.getElementById('create-name').focus(), 50);
}

function showJoinModal() {
  document.getElementById('join-code').value = '';
  document.getElementById('join-modal').classList.add('show');
  setTimeout(() => document.getElementById('join-code').focus(), 50);
}

function showNickModal() {
  document.getElementById('global-nick').value = state.nickname || '';
  document.getElementById('nick-modal').classList.add('show');
  setTimeout(() => document.getElementById('global-nick').focus(), 50);
}

function renderIconPicker() {
  const picker = document.getElementById('icon-picker');
  picker.innerHTML = ICONS.map((ic, i) =>
    `<button type="button" data-icon="${ic}" class="${ic===selectedIcon?'active':''}">${ic}</button>`
  ).join('');
  picker.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      selectedIcon = b.dataset.icon;
      picker.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });
}

function setCodeMode(mode) {
  codeMode = mode;
  document.querySelectorAll('.code-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  const input = document.getElementById('create-code');
  if (mode === 'random') {
    input.value = randomCode();
    input.readOnly = true;
    input.placeholder = '自动生成';
  } else {
    input.value = '';
    input.readOnly = false;
    input.placeholder = '输入自定义加入码';
    setTimeout(() => input.focus(), 50);
  }
}

function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

/* ===================== Utils ===================== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
let toastTimer;
function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ===================== Event bindings ===================== */
function bindEvents() {
  // Plus menu
  document.getElementById('plus-btn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('menu').classList.toggle('show');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#menu') && !e.target.closest('#plus-btn')) {
      document.getElementById('menu').classList.remove('show');
    }
  });
  document.getElementById('menu-create').addEventListener('click', () => {
    document.getElementById('menu').classList.remove('show');
    showCreateModal();
  });
  document.getElementById('menu-join').addEventListener('click', () => {
    document.getElementById('menu').classList.remove('show');
    showJoinModal();
  });



  // Create modal
  document.querySelectorAll('.code-toggle button').forEach(b => {
    b.addEventListener('click', () => setCodeMode(b.dataset.mode));
  });
  document.getElementById('regen-code').addEventListener('click', () => {
    if (codeMode === 'random') document.getElementById('create-code').value = randomCode();
  });
  document.getElementById('create-cancel').addEventListener('click', () => {
    document.getElementById('create-modal').classList.remove('show');
  });
  document.getElementById('create-confirm').addEventListener('click', () => {
    const name = document.getElementById('create-name').value.trim();
    let code = document.getElementById('create-code').value.trim();
    if (!name) { toast('请输入群聊名称'); return; }
    if (!code) { toast('请输入加入码'); return; }
    if (state.groups.some(g => g.code === code)) { toast('该加入码已被使用'); return; }
    document.getElementById('create-modal').classList.remove('show');
    createGroup(name, code, selectedIcon);
  });

  // Join modal
  document.getElementById('join-cancel').addEventListener('click', () => {
    document.getElementById('join-modal').classList.remove('show');
  });
  document.getElementById('join-confirm').addEventListener('click', () => {
    const code = document.getElementById('join-code').value.trim().toUpperCase();
    if (!code) { toast('请输入加入码'); return; }
    // Validate: code must exist in the global group registry
    const reg = loadGroupRegistry();
    if (!reg[code]) {
      toast('加入码无效，该群聊不存在');
      return;
    }
    document.getElementById('join-modal').classList.remove('show');
    joinGroup(code);
  });

  // Nick modal
  document.getElementById('nick-confirm').addEventListener('click', () => {
    const nick = document.getElementById('global-nick').value.trim();
    if (!nick) { toast('请输入昵称'); return; }
    state.nickname = nick;
    saveState();
    document.getElementById('nick-modal').classList.remove('show');
    const action = pendingCreateAction;
    pendingCreateAction = null;
    if (action === 'create') showCreateModal();
    else if (action === 'join') showJoinModal();
  });

  // Auth modal - bind buttons in CAPTURE phase so they always fire first (BEFORE any parent capture listeners run)
  const AUTH_CAP = true;
  document.getElementById('auth-toggle').addEventListener('click', e => {
    e.stopPropagation();
    authMode = authMode === 'register' ? 'login' : 'register';
    applyAuthMode();
    document.getElementById('auth-error').textContent = '';
  }, AUTH_CAP);
  document.getElementById('auth-submit').addEventListener('click', e => {
    e.stopPropagation();
    handleAuthSubmit();
  }, AUTH_CAP);
  document.getElementById('fill-admin-btn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('auth-user').value = DEFAULT_ADMIN_USER;
    document.getElementById('auth-pass').value = DEFAULT_ADMIN_PASS;
    document.getElementById('auth-error').textContent = '';
  }, AUTH_CAP);
  // IMPORTANT: Only stop propagation on LEAF elements (no descendants that need click events)
  // Do NOT add capture stopPropagation on CONTAINERS (modal-actions, .field) - blocks child events!
  document.querySelectorAll('#auth-modal input, #auth-modal .field-hint, #auth-modal .remember-row, #auth-modal label').forEach(el => {
    el.addEventListener('click', e => e.stopPropagation());
  });
  ['auth-user','auth-pass','auth-nick','auth-invite'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') handleAuthSubmit();
    });
  });

  // Logout
  document.getElementById('logout-btn').addEventListener('click', e => {
    e.stopPropagation();
    logout();
  });

  // Admin panel
  document.getElementById('admin-btn').addEventListener('click', openAdminPanel);
  document.getElementById('admin-close').addEventListener('click', closeAdminPanel);
  document.querySelectorAll('.admin-tab').forEach(b => {
    b.addEventListener('click', () => switchAdminTab(b.dataset.tab));
  });
  document.getElementById('add-invite-btn').addEventListener('click', addInviteCode);
  document.getElementById('new-invite').addEventListener('keydown', e => {
    if (e.key === 'Enter') addInviteCode();
  });
  document.getElementById('reset-cancel').addEventListener('click', () => {
    document.getElementById('reset-modal').classList.remove('show');
    adminResetUser = null;
  });
  document.getElementById('reset-confirm').addEventListener('click', confirmReset);
  document.getElementById('reset-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmReset();
  });

  // Group management (admin)
  document.getElementById('import-group-btn').addEventListener('click', importGroupByCode);
  document.getElementById('new-group-code').addEventListener('keydown', e => {
    if (e.key === 'Enter') importGroupByCode();
  });
  document.getElementById('eg-cancel').addEventListener('click', () => {
    document.getElementById('edit-group-modal').classList.remove('show');
    editingGroupCode = null;
  });
  document.getElementById('eg-save').addEventListener('click', saveEditGroup);
  ['eg-name','eg-code'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') saveEditGroup();
    });
  });

  // Close modal on overlay click (EXCEPT auth modal - never closes on outside click)
  document.querySelectorAll('.modal-overlay').forEach(ov => {
    ov.addEventListener('click', e => {
      if (e.target === ov && ov.id !== 'auth-modal') ov.classList.remove('show');
    });
  });

  // Auth modal - capture phase: ONLY block clicks on the OUTSIDE overlay area (not .modal interior)
  const authOverlay = document.getElementById('auth-modal');
  const authModalBox = authOverlay.querySelector('.modal');
  authOverlay.addEventListener('click', e => {
    if (getSession()) return; // already logged in - allow normal behavior
    // CRITICAL FIX: Allow any click that is INSIDE the .modal content box (any child element)
    if (e.target === authModalBox || authModalBox.contains(e.target)) {
      return; // let it pass through freely
    }
    // Only block clicks on the raw overlay background (outside the modal box)
    if (e.target === authOverlay || !authModalBox.contains(e.target)) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      authOverlay.classList.add('show');
      return false;
    }
  }, true);

  // Also block middle/right click context menu attempts on overlay
  authOverlay.addEventListener('contextmenu', e => {
    if (!getSession()) e.preventDefault();
  });

  // Lock auth modal: when user is NOT logged in, auth modal cannot be dismissed in any way
  function isAuthed() { return !!getSession(); }
  function lockAuthModalIfLoggedOut() {
    const authModal = document.getElementById('auth-modal');
    if (!isAuthed()) {
      authModal.classList.add('show');
      // Force visibility - ensure it's shown even if someone tries to hide it
      requestAnimationFrame(() => {
        if (!isAuthed()) authModal.classList.add('show');
      });
    }
  }
  // Periodic check every 300ms to ensure auth modal stays visible when logged out
  setInterval(lockAuthModalIfLoggedOut, 300);
  // Run immediately on bind
  lockAuthModalIfLoggedOut();

  // Back button on mobile (chat header) - optional
  window.addEventListener('resize', () => {});
}

/* ===================== Init ===================== */
function init() {
  bindEvents();

  // Check session: auto-login if previously authenticated
  const sessUser = getSession();
  if (sessUser) {
    const accts = loadAccounts();
    const acct = accts[sessUser];
    if (acct) {
      migrateLegacyStateIfNeeded();
      // Load per-user state from their own storage key
      state = loadState();
      state.nickname = acct.nick;
      saveState();
      renderGroupList();
      updateUserChip();
      connectMQTT();
    } else {
      setSession(null);
      state = loadState();
      renderGroupList();
      showAuthModal();
    }
  } else {
    state = loadState();
    renderGroupList();
    showAuthModal();
  }

  // re-subscribe on reconnect
  setInterval(() => {
    if (client && client.connected) {
      state.groups.forEach(g => {
        if (!client._subs || !client._subs[TOPIC_PREFIX + g.code]) {
          client.subscribe(TOPIC_PREFIX + g.code, { qos: 0 });
        }
      });
    }
  }, 5000);
}
init();
</script>
